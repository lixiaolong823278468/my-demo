<div class="log-widget">
    <input type="checkbox" id="log-panel-toggle">
    <div class="log-panel">
        <div class="log-topbar">
            <label for="log-panel-toggle" class="log-hide-btn">隐藏</label>
            <div>
                <div class="log-title">运行状态窗口</div>
                <div class="log-subtitle">{current_status}</div>
            </div>
        </div>
        <div class="log-body">{body_html}</div>
    </div>
    <label for="log-panel-toggle" class="log-show-fab">显示运行状态窗口</label>
</div>
